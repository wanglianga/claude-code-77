spring:
  application:
    name: elevator-rescue-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/elevator_rescue}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt-secret: ${JWT_SECRET:dev-secret-key-please-change-0123456789abcdef}
  jwt-expire-hours: ${JWT_EXPIRE_HOURS:12}
  # 维保单位到场时限（分钟），超时自动标记“维保迟到”
  arrive-limit-minutes: ${ARRIVE_LIMIT_MINUTES:30}
  # 救援超时提醒阈值（分钟）：超过未释放提醒联系 120 / 消防优先介入
  rescue-alert-minutes: ${RESCUE_ALERT_MINUTES:30}
  # 通话间隔提醒阈值（分钟）：超过未通话提醒保持通话频率
  call-remind-minutes: ${CALL_REMIND_MINUTES:10}
  rectification:
    # 停梯整改申请触发阈值：同一电梯窗口期内困人事件达到该起数才允许申请（事务内重新核验）
    trigger-threshold: ${RECTIFICATION_TRIGGER_THRESHOLD:2}
    # 触发证据窗口（天）
    trigger-window-days: ${RECTIFICATION_TRIGGER_WINDOW_DAYS:7}
